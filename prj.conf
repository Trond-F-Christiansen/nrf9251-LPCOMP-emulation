CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_SHELL=y


# The SAADC limit module drives the SAADC, RTC130 and DPPI through nrfx directly.
CONFIG_NRFX_SAADC=y
CONFIG_NRFX_RTC=y
CONFIG_NRFX_GPPI=y

# The GPIO driver initializes GPIOTE130, which drives the comparator output pin.
CONFIG_GPIO=y
